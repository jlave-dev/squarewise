<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SquareWise aligned app icon preview</title>
  <desc id="desc">Aligned SquareWise app icon shown on a dark background.</desc>

  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#17223E" />
      <stop offset="100%" stop-color="#0F1730" />
    </radialGradient>
    <style>
      .heading {
        fill: #F8FAFC;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 44px;
        font-weight: 600;
        letter-spacing: 0;
      }
      .sub {
        fill: #94A3B8;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 24px;
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-glow)" />
  <g transform="translate(520 118) scale(0.546875)">
    <defs>
      <clipPath id="icon-clip-dark">
        <rect x="112" y="112" width="800" height="800" rx="140" ry="140" />
      </clipPath>
      <style>
        .icon-outline { fill: none; stroke: #E6E9EF; stroke-width: 16; stroke-linejoin: round; }
        .icon-label {
          fill: #F8FAFC;
          font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          font-size: 76px;
          font-weight: 700;
          letter-spacing: 0;
        }
      </style>
    </defs>
    <g clip-path="url(#icon-clip-dark)">
      <rect x="112" y="112" width="400" height="400" fill="#2B3A66" />
      <rect x="512" y="112" width="400" height="400" fill="#5A5A3A" />
      <rect x="112" y="512" width="400" height="400" fill="#4A2F4B" />
      <rect x="512" y="512" width="400" height="400" fill="#2E4B52" />
    </g>
    <rect x="112" y="112" width="800" height="800" rx="140" ry="140" class="icon-outline" />
    <path d="M512 112V912" class="icon-outline" />
    <path d="M112 520H912" class="icon-outline" />
    <text x="188" y="234" class="icon-label">1</text>
    <text x="588" y="234" class="icon-label">5+</text>
    <text x="188" y="634" class="icon-label">4÷</text>
    <text x="588" y="634" class="icon-label">7+</text>
  </g>
  <text x="800" y="760" text-anchor="middle" class="heading">Aligned app icon draft</text>
  <text x="800" y="804" text-anchor="middle" class="sub">Consistent top-left clue placement across all four cells</text>
</svg>
