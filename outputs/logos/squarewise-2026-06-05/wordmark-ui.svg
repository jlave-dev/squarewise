<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 280" role="img" aria-labelledby="title desc">
  <title id="title">SquareWise UI wordmark</title>
  <desc id="desc">Compact UI wordmark for top bars and in-app chrome.</desc>

  <defs>
    <style>
      .word {
        fill: #0F1730;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 220px;
        font-weight: 700;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <text x="20" y="224" class="word">SquareWise</text>
</svg>
