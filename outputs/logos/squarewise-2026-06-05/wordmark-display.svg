<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 480" role="img" aria-labelledby="title desc">
  <title id="title">SquareWise display wordmark</title>
  <desc id="desc">Display wordmark with precise cage-clue framing for larger brand use.</desc>

  <defs>
    <style>
      .frame {
        fill: none;
        stroke: #0F1730;
        stroke-width: 12;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .word {
        fill: #0F1730;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 220px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .clue {
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .clue-olive { fill: #5A5A3A; }
      .clue-plum { fill: #4A2F4B; }
    </style>
  </defs>

  <path class="frame" d="M72 300V96H222" />
  <path class="frame" d="M1488 318V406H1296" />

  <text x="252" y="304" class="word">SquareWise</text>
  <text x="112" y="184" class="clue clue-olive">5+</text>
  <text x="1346" y="372" class="clue clue-plum">2÷</text>
</svg>
