<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">SquareWise wordmark review board</title>
  <desc id="desc">Review board showing display wordmark, compact UI wordmark, and aligned app icon.</desc>

  <defs>
    <style>
      .title {
        fill: #0F1730;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .note {
        fill: #64748B;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0;
      }
      .divider {
        stroke: #E2E8F0;
        stroke-width: 2;
      }
      .frame {
        fill: none;
        stroke: #0F1730;
        stroke-width: 12;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .display-word {
        fill: #0F1730;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 220px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .ui-word {
        fill: #0F1730;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 176px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .clue {
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .clue-olive { fill: #5A5A3A; }
      .clue-plum { fill: #4A2F4B; }
      .icon-outline {
        fill: none;
        stroke: #E6E9EF;
        stroke-width: 16;
        stroke-linejoin: round;
      }
      .icon-label {
        fill: #F8FAFC;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <rect width="1800" height="1300" fill="#FFFFFF" />

  <text x="76" y="110" class="title">Display wordmark</text>
  <text x="76" y="150" class="note">Use for brand pages, splash moments, share graphics, and other larger surfaces.</text>
  <line x1="72" y1="182" x2="1728" y2="182" class="divider" />

  <g transform="translate(0 0)">
    <path class="frame" d="M72 450V246H222" />
    <path class="frame" d="M1488 468V556H1296" />
    <text x="252" y="454" class="display-word">SquareWise</text>
    <text x="112" y="334" class="clue clue-olive">5+</text>
    <text x="1346" y="524" class="clue clue-plum">2÷</text>
  </g>

  <text x="76" y="700" class="title">Compact UI wordmark</text>
  <text x="76" y="740" class="note">Use inside top bars and in-app chrome where decorative clues would get noisy.</text>
  <line x1="72" y1="772" x2="1728" y2="772" class="divider" />

  <text x="96" y="1006" class="ui-word">SquareWise</text>

  <g transform="translate(1390 844) scale(0.2734375)">
    <clipPath id="icon-clip-review">
      <rect x="112" y="112" width="800" height="800" rx="140" ry="140" />
    </clipPath>
    <g clip-path="url(#icon-clip-review)">
      <rect x="112" y="112" width="400" height="400" fill="#2B3A66" />
      <rect x="512" y="112" width="400" height="400" fill="#5A5A3A" />
      <rect x="112" y="512" width="400" height="400" fill="#4A2F4B" />
      <rect x="512" y="512" width="400" height="400" fill="#2E4B52" />
    </g>
    <rect x="112" y="112" width="800" height="800" rx="140" ry="140" class="icon-outline" />
    <path d="M512 112V912" class="icon-outline" />
    <path d="M112 520H912" class="icon-outline" />
    <text x="188" y="234" class="icon-label">1</text>
    <text x="588" y="234" class="icon-label">5+</text>
    <text x="188" y="634" class="icon-label">4÷</text>
    <text x="588" y="634" class="icon-label">7+</text>
  </g>
</svg>
