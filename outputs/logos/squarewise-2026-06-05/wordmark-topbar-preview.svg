<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1116" role="img" aria-labelledby="title desc">
  <title id="title">SquareWise top bar wordmark preview</title>
  <desc id="desc">Compact UI wordmark preview inside an app-style top bar.</desc>

  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#16213B" />
      <stop offset="100%" stop-color="#131D33" />
    </radialGradient>
    <style>
      .bar {
        fill: #202B44;
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 2;
      }
      .brand {
        fill: #F8FAFC;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .meta {
        fill: #A7B2C7;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0;
      }
      .timer {
        fill: #F8FAFC;
        font-family: "SF Mono", "Roboto Mono", ui-monospace, Menlo, Monaco, monospace;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .shell {
        fill: rgba(255, 255, 255, 0.03);
        stroke: rgba(255, 255, 255, 0.05);
        stroke-width: 1.5;
      }
      .glyph {
        fill: #F8FAFC;
        fill-opacity: 0.9;
      }
      .icon-outline {
        fill: none;
        stroke: #E6E9EF;
        stroke-width: 16;
        stroke-linejoin: round;
      }
      .icon-label {
        fill: #F8FAFC;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <rect width="2048" height="1116" fill="url(#bg-glow)" />
  <rect x="592" y="14" width="871" height="107" rx="14" class="bar" />

  <g transform="translate(624 38) scale(0.03515625)">
    <clipPath id="icon-clip-topbar">
      <rect x="112" y="112" width="800" height="800" rx="140" ry="140" />
    </clipPath>
    <g clip-path="url(#icon-clip-topbar)">
      <rect x="112" y="112" width="400" height="400" fill="#2B3A66" />
      <rect x="512" y="112" width="400" height="400" fill="#5A5A3A" />
      <rect x="112" y="512" width="400" height="400" fill="#4A2F4B" />
      <rect x="512" y="512" width="400" height="400" fill="#2E4B52" />
    </g>
    <rect x="112" y="112" width="800" height="800" rx="140" ry="140" class="icon-outline" />
    <path d="M512 112V912" class="icon-outline" />
    <path d="M112 520H912" class="icon-outline" />
    <text x="188" y="234" class="icon-label">1</text>
    <text x="588" y="234" class="icon-label">5+</text>
    <text x="188" y="634" class="icon-label">4÷</text>
    <text x="588" y="634" class="icon-label">7+</text>
  </g>

  <text x="670" y="56" class="brand">SquareWise</text>
  <text x="670" y="84" class="meta">Tutorial - Beginner - 4x4</text>
  <text x="952" y="67" class="timer">22:26</text>

  <g transform="translate(1110 36)">
    <rect x="0" y="0" width="48" height="48" rx="12" class="shell" />
    <path d="M24 13c-5.7 0-10.3 4.6-10.3 10.3 0 1.5.3 3 1 4.4l-4.3-1.1 1.1 4.4 1.1-1.1c2.2 2 5.1 3.2 8.3 3.2 6.9 0 12.5-5.6 12.5-12.5v-1.6h-3v1.6c0 5.2-4.3 9.5-9.5 9.5-2.2 0-4.1-.7-5.7-1.9l4.8-4.8h-8.7v8.7l1.8-1.8c2.1 2 4.8 3.2 7.9 3.2 6.5 0 11.8-5.3 11.8-11.8S30.5 13 24 13Z" class="glyph" />

    <rect x="62" y="0" width="48" height="48" rx="12" class="shell" />
    <path d="M86 13c5.7 0 10.3 4.6 10.3 10.3 0 1.5-.3 3-1 4.4l4.3-1.1-1.1 4.4-1.1-1.1c-2.2 2-5.1 3.2-8.3 3.2-6.9 0-12.5-5.6-12.5-12.5v-1.6h3v1.6c0 5.2 4.3 9.5 9.5 9.5 2.2 0 4.1-.7 5.7-1.9L90 23.4h8.7v8.7l-1.8-1.8c-2.1 2-4.8 3.2-7.9 3.2-6.5 0-11.8-5.3-11.8-11.8S79.5 13 86 13Z" class="glyph" />

    <rect x="124" y="0" width="48" height="48" rx="12" class="shell" />
    <rect x="143" y="12" width="8" height="24" rx="2" class="glyph" />
    <rect x="157" y="12" width="8" height="24" rx="2" class="glyph" />

    <rect x="186" y="0" width="48" height="48" rx="12" class="shell" />
    <rect x="202" y="24" width="6" height="12" rx="2" class="glyph" />
    <rect x="212" y="18" width="6" height="18" rx="2" class="glyph" />
    <rect x="222" y="10" width="6" height="26" rx="2" class="glyph" />

    <rect x="248" y="0" width="48" height="48" rx="12" class="shell" />
    <circle cx="272" cy="24" r="6" class="glyph" />
    <path d="M272 10l2 4 4 1-3 3 .7 4.2-3.7-2.1-3.7 2.1.7-4.2-3-3 4-1 2-4Zm0 28 2 4 4 1-3 3 .7 4.2-3.7-2.1-3.7 2.1.7-4.2-3-3 4-1 2-4Zm-14-14 4 2 1 4-3 3 2 4-4-1-4 1 2-4-3-3 1-4 4-2Zm28 0 4 2 1 4-3 3 2 4-4-1-4 1 2-4-3-3 1-4 4-2Z" class="glyph" />

    <rect x="310" y="0" width="48" height="48" rx="12" class="shell" />
    <rect x="322" y="21" width="24" height="6" rx="3" class="glyph" />
    <rect x="331" y="12" width="6" height="24" rx="3" class="glyph" />
  </g>
</svg>
