<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SquareWise aligned app icon</title>
  <desc id="desc">A four-cell SquareWise app icon with consistently aligned clue numbers.</desc>

  <defs>
    <clipPath id="icon-clip">
      <rect x="112" y="112" width="800" height="800" rx="140" ry="140" />
    </clipPath>
    <style>
      .outline { fill: none; stroke: #E6E9EF; stroke-width: 16; stroke-linejoin: round; }
      .label {
        fill: #F8FAFC;
        font-family: Inter, Satoshi, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <g clip-path="url(#icon-clip)">
    <rect x="112" y="112" width="400" height="400" fill="#2B3A66" />
    <rect x="512" y="112" width="400" height="400" fill="#5A5A3A" />
    <rect x="112" y="512" width="400" height="400" fill="#4A2F4B" />
    <rect x="512" y="512" width="400" height="400" fill="#2E4B52" />
  </g>

  <rect x="112" y="112" width="800" height="800" rx="140" ry="140" class="outline" />
  <path d="M512 112V912" class="outline" />
  <path d="M112 520H912" class="outline" />

  <text x="188" y="234" class="label">1</text>
  <text x="588" y="234" class="label">5+</text>
  <text x="188" y="634" class="label">4÷</text>
  <text x="588" y="634" class="label">7+</text>
</svg>
